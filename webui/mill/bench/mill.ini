# webui/mill/bench: the console's gantry mill (X Y Y Z) on the bench: X is
# the real stmbl drive on the 7C81 (as hwtest/burnin), Y, Y2 and Z are
# simulated. millweb is the display: LinuxCNC runs headless, the console is
# a browser on http://<host>:8080/.
#   cd webui/mill/bench && linuxcnc mill.ini
# THE X AXIS MOVES: it homes where it stands; X travel is -300..300 mm from
# there (the burn-in axis), 500 mm/s, 1000 mm/s^2. G54 puts a program's
# X 0..120 at machine X -60..60.
[EMC]
VERSION = 1.1
MACHINE = PORTAL-M bench (X real)
DEBUG = 0

[DISPLAY]
DISPLAY = ../millweb
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 500
DEFAULT_LINEAR_VELOCITY = 50
PROGRAM_PREFIX = ../test/sim/nc_files
# LinuxCNC clamps the overrides to these (the default feed maximum is 100 %)
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.5

[MILLWEB]
# the console's backend (webui/mill/README.md)
PORT = 8080
HOST = 0.0.0.0
POLL_HZ = 30
# X Y (machine) Z_above Z_ref [travel]: length = touched Z - Z_ref
TOOLSETTER = 250 20 -40 -245 200
# jogs stay inside the work area (machine): the program's X -60..60 with a
# margin, Y around the part, Z down to the stock's top
WORKSPACE_X = -100 100
WORKSPACE_Y = 400 600
WORKSPACE_Z = -195 0
# millweb and its previews off the real-time cores (isolcpus=2,3 on the bench Pi)
CPUS = 0-1
PIN = joint.0.f-error
PIN = hm2_7c81.0.stbl.0.0.vel_fb
DRIVE = X hm2_7c81.0.stbl.0.0.current hm2_7c81.0.stbl.0.0.power hm2_7c81.0.stbl.0.0.fault
# the Drives tab: the drive's console (sserialterm's pty) and its pins
DRIVE_LINK = X /tmp/drive-x hm2_7c81.0.stbl.0.0
PIN = joint.1.f-error
PIN = joint.3.motor-pos-fb
PIN = motion.probe-input
PIN = spindle.0.speed-out
AT_SPEED_PIN = spindle.0.at-speed
# TOKEN = something     to require it for taking control
# ON_CONTROL_LOSS = hold   feed hold when the controlling browser goes away

[RS274NGC]
PARAMETER_FILE = bench.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = mill.hal
# a larger following error while the drive may autophase (hwtest/burnin)
POSTGUI_HALFILE = phasing_ferror.hal

[TRAJ]
COORDINATES = X Y Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 500
MAX_LINEAR_ACCELERATION = 3000

[HOSTMOT2]
# the SPI driver and its parameters; tools/ssflash.sh, hwtest/suite and
# hwtest/phasing read these too. hm2_spix (LinuxCNC >= 2.9.4) on the bench's
# Pi 4 + 7C81: writes work to 41.7 MHz, reads fail at 41.7 (MISO shifted a
# bit); 35.7/31.25 worked for days, then a cold start read shifted at
# 31.25: 25 MHz both ways (DEBUGNOTES 2026-10-21, 2026-10-23).
# hm2_rpspi: DRIVER = hm2_rpspi, DRIVER_PARAMS = spiclk_rate=31250
DRIVER = hm2_spix
DRIVER_PARAMS = spiclk_rate=25000 spiclk_rate_rd=25000
BOARD=7c81
#CONFIG=""

CONFIG=" sserial_port_0=00000000"

[SSERIALTERM]
TTY = /tmp/drive-x

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH
JOINTS = 4

[AXIS_X]
# the real axis: 500 mm/s = 3000 rpm at 10 mm/rev (hwtest/burnin)
MIN_LIMIT = -300
MAX_LIMIT = 300
MAX_VELOCITY = 500
MAX_ACCELERATION = 1000

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 1000
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000

[AXIS_Z]
MIN_LIMIT = -215
MAX_LIMIT = 0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000

[JOINT_0]
# the real drive; homed where it stands
TYPE = LINEAR
MIN_LIMIT = -301
MAX_LIMIT = 301
MAX_VELOCITY = 500
MAX_ACCELERATION = 1000
FERROR = 1
MIN_FERROR = 1
# until homed and for PHASING_TIME s after each enable (phasing_ferror.hal)
PHASING_FERROR = 2.0
PHASING_TIME = 1.5
# homing: creep to the encoder's index (at most one revolution, 10 mm),
# that is X 0; no switch on the bench
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 3
HOME_USE_INDEX = YES
HOME_OFFSET = 0
HOME = 0
HOME_SEQUENCE = 2

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 550
MAX_ACCELERATION = 3300
FERROR = 2
MIN_FERROR = 0.5
# Y1/Y2 home together (a gantry) onto switches at the far end (Y 1000)
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 5
HOME_OFFSET = 1000
HOME = 990
HOME_SEQUENCE = -1

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 550
MAX_ACCELERATION = 3300
FERROR = 2
MIN_FERROR = 0.5
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 5
HOME_OFFSET = 1000
HOME = 990
HOME_SEQUENCE = -1

[JOINT_3]
TYPE = LINEAR
MIN_LIMIT = -216
MAX_LIMIT = 1
MAX_VELOCITY = 220
MAX_ACCELERATION = 2200
FERROR = 2
MIN_FERROR = 0.5
# Z first, up onto a switch at the top (Z 0), then 5 mm down
HOME_SEARCH_VEL = 20
HOME_LATCH_VEL = 2
HOME_OFFSET = 0
HOME = -5
HOME_SEQUENCE = 0
