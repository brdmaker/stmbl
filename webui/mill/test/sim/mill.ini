# webui/mill/test/sim: a gantry mill (X Y Y Z, trivkins) with no hardware:
# motion's commands loop back as the feedback, the tool change answers
# itself, and a probe trips below machine Z -195 (the stock's top). millweb
# is the display program: LinuxCNC runs headless, the console is a browser.
#   make -C webui/mill sim      then http://<host>:8080/
[EMC]
VERSION = 1.1
MACHINE = PORTAL-M sim
DEBUG = 0

[DISPLAY]
DISPLAY = ../../millweb
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 500
DEFAULT_LINEAR_VELOCITY = 50
PROGRAM_PREFIX = nc_files
# LinuxCNC clamps the overrides to these (the default feed maximum is 100 %)
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.5

[MILLWEB]
# the console's backend (webui/mill/README.md)
PORT = 8080
HOST = 0.0.0.0
POLL_HZ = 30
# X Y (machine) Z_above Z_ref [travel]: length = touched Z - Z_ref
TOOLSETTER = 980 20 -40 -245 200
# the simulated probe: millweb sets its stock (from the 3D setup) and the tool length
SIM_PROBE = yes
# the tools' true lengths in the simulation (the others: their table length)
SIM_TOOLS = 3:51.25
PIN = joint.0.f-error
PIN = joint.1.f-error
PIN = joint.3.motor-pos-fb
PIN = motion.probe-input
PIN = spindle.0.speed-out
AT_SPEED_PIN = spindle.0.at-speed
# TOKEN = something     to require it for taking control
# ON_CONTROL_LOSS = hold   feed hold when the controlling browser goes away

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = mill.hal

[TRAJ]
COORDINATES = X Y Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 500
MAX_LINEAR_ACCELERATION = 3000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH
JOINTS = 4

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 1000
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 1000
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000

[AXIS_Z]
MIN_LIMIT = -215
MAX_LIMIT = 0
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 550
MAX_ACCELERATION = 3300
FERROR = 2
MIN_FERROR = 0.5
HOME = 500
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 550
MAX_ACCELERATION = 3300
FERROR = 2
MIN_FERROR = 0.5
HOME = 500
HOME_SEQUENCE = -1
HOME_ABSOLUTE_ENCODER = 2

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 550
MAX_ACCELERATION = 3300
FERROR = 2
MIN_FERROR = 0.5
HOME = 500
HOME_SEQUENCE = -1
HOME_ABSOLUTE_ENCODER = 2

[JOINT_3]
TYPE = LINEAR
MIN_LIMIT = -216
MAX_LIMIT = 1
MAX_VELOCITY = 220
MAX_ACCELERATION = 2200
FERROR = 2
MIN_FERROR = 0.5
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2
