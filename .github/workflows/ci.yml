# stmbl CI: the host simulator's self-checking suite and the firmware build.
# Hardware tests (hwtest/suite, soak, fbtest) need the bench and stay manual.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the runners' Ubuntu mirror sometimes fails to resolve (2026-11-11):
      # apt retries each fetch, the whole install three times, and a hung
      # mirror fails the step after 15 minutes instead of the job's 30
      - name: Install toolchain
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 &&
            sudo apt-get install -y -qq -o Acquire::Retries=3 gcc-arm-none-eabi libnewlib-arm-none-eabi && break
            echo "apt failed (try $i), again in 30 s"; sleep 30
          done
          arm-none-eabi-gcc --version | head -1
          arm-none-eabi-ld --version | head -1
      # F4 bootloader + application, F3 bootloader + application, the
      # whole-chip images and .dfu files (make deploy, as releases)
      - name: Drive firmware (make deploy)
        run: make -j"$(nproc)" deploy
      - name: vibsensor
        run: make -j"$(nproc)" -C vibsensor
      - name: brdstepper
        run: make -j"$(nproc)" -C brdstepper
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            obj_app/stmbl.bin
            obj_app/stmbl.elf
            stmbl.dfu
            f4.bin
            f4.dfu
            f3.bin
            f3.dfu
          if-no-files-found: error

  host-check:
    name: Host simulator check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # the ARM toolchain and QEMU run host/m4's Cortex-M4 unit tests; gmsh
      # and numpy run tests/robot/test_step2cell.py (the libs are gmsh's)
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 &&
            sudo apt-get install -y -qq -o Acquire::Retries=3 gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm \
              libglu1-mesa libxcursor1 libxinerama1 libxft2 && break
            echo "apt failed (try $i), again in 30 s"; sleep 30
          done
          python3 -m pip install --user --break-system-packages -q numpy gmsh
      - name: make -C host check
        run: make -C host -j"$(nproc)" check
