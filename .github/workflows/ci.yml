# stmbl CI: the host simulator's self-checking suite and the firmware build.
# Hardware tests (hwtest/suite, soak, fbtest) need the bench and stay manual.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the runners' Ubuntu mirror fails for a quarter of an hour at a time
      # (runs 28, 30, 42, 44, 49, 51): the packages' .deb files are kept in
      # GitHub's cache and installed from there; only a miss asks a mirror
      # (.github/ci-apt.sh: bounded tries, another mirror on a retry)
      - id: img  # the runner image's version: a new image saves its own cache
        run: echo "v=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-fw-${{ steps.img.outputs.v }}-${{ hashFiles('.github/ci-apt.sh') }}-gcc-arm-newlib
          restore-keys: apt-fw-
      - name: Install toolchain
        timeout-minutes: 15
        run: |
          .github/ci-apt.sh ~/apt-debs arm-none-eabi-gcc gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
          arm-none-eabi-ld --version | head -1
      # F4 bootloader + application, F3 bootloader + application, the
      # whole-chip images and .dfu files (make deploy, as releases)
      - name: Drive firmware (make deploy)
        run: make -j"$(nproc)" deploy
      - name: vibsensor
        run: make -j"$(nproc)" -C vibsensor
      - name: brdstepper
        run: make -j"$(nproc)" -C brdstepper
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            obj_app/stmbl.bin
            obj_app/stmbl.elf
            stmbl.dfu
            f4.bin
            f4.dfu
            f3.bin
            f3.dfu
          if-no-files-found: error

  host-check:
    name: Host simulator check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # the ARM toolchain and QEMU run host/m4's Cortex-M4 unit tests; gmsh
      # and numpy run tests/robot/test_step2cell.py (the libs are gmsh's)
      # (apt as in the firmware job: from GitHub's cache, a mirror only on a miss)
      - id: img
        run: echo "v=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-host-${{ steps.img.outputs.v }}-${{ hashFiles('.github/ci-apt.sh') }}-gcc-arm-newlib-qemu-glu-xcursor-xinerama-xft
          restore-keys: apt-host-
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          .github/ci-apt.sh ~/apt-debs arm-none-eabi-gcc gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm \
            libglu1-mesa libxcursor1 libxinerama1 libxft2
          command -v qemu-system-arm >/dev/null || { echo "::error::qemu-system-arm is missing"; exit 1; }
          timeout 300 python3 -m pip install --user --break-system-packages -q --timeout 30 --retries 5 numpy gmsh
      - name: make -C host check
        run: make -C host -j"$(nproc)" check
