# stmbl CI: the host simulator's self-checking suite and the firmware build.
# Hardware tests (hwtest/suite, soak, fbtest) need the bench and stay manual.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the runners' Ubuntu mirror sometimes fails to resolve (2026-11-11):
      # apt retries each fetch, the whole install three times. A stalled mirror
      # hangs apt rather than failing it (runs 28 and 30 sat 15 minutes in one
      # try): each try gets 4 minutes and each connection 30 s, so a hang is
      # retried too; the step's 15 minutes stay the last resort
      - name: Install toolchain
        timeout-minutes: 15
        run: |
          APT="-qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 240 apt-get update $APT &&
            sudo timeout 240 apt-get install -y $APT gcc-arm-none-eabi libnewlib-arm-none-eabi && break
            echo "apt failed or hung (try $i), again in 20 s"; sudo dpkg --configure -a || true; sleep 20
          done
          command -v arm-none-eabi-gcc >/dev/null || { echo "::error::the ARM toolchain didn't install"; exit 1; }
          arm-none-eabi-gcc --version | head -1
          arm-none-eabi-ld --version | head -1
      # F4 bootloader + application, F3 bootloader + application, the
      # whole-chip images and .dfu files (make deploy, as releases)
      - name: Drive firmware (make deploy)
        run: make -j"$(nproc)" deploy
      - name: vibsensor
        run: make -j"$(nproc)" -C vibsensor
      - name: brdstepper
        run: make -j"$(nproc)" -C brdstepper
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            obj_app/stmbl.bin
            obj_app/stmbl.elf
            stmbl.dfu
            f4.bin
            f4.dfu
            f3.bin
            f3.dfu
          if-no-files-found: error

  host-check:
    name: Host simulator check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # the ARM toolchain and QEMU run host/m4's Cortex-M4 unit tests; gmsh
      # and numpy run tests/robot/test_step2cell.py (the libs are gmsh's)
      # (apt as in the firmware job: each try bounded, a hang retried)
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          APT="-qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 240 apt-get update $APT &&
            sudo timeout 240 apt-get install -y $APT gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm \
              libglu1-mesa libxcursor1 libxinerama1 libxft2 && break
            echo "apt failed or hung (try $i), again in 20 s"; sudo dpkg --configure -a || true; sleep 20
          done
          command -v arm-none-eabi-gcc >/dev/null || { echo "::error::the ARM toolchain didn't install"; exit 1; }
          timeout 300 python3 -m pip install --user --break-system-packages -q --timeout 30 --retries 5 numpy gmsh
      - name: make -C host check
        run: make -C host -j"$(nproc)" check
