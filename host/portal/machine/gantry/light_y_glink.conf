# pcbdrill's Y with the gantry link instead of the workaround in pcbdrill_y.conf
# (the default current loop, vel_bw 500).
link pid
link pmsm
link enc_fb0
link misc
link sserial
conf0.polecount = 1
conf0.mot_fb_res = 60960
conf0.r = 7
conf0.l = 0.009
conf0.psi = 0.96
conf0.j = 0.0020238
conf0.j_sys = 0
conf0.f = 0.194
conf0.d = 0.002353
conf0.max_ac_cur = 11.6
conf0.max_force = 16.75
conf0.max_vel = 309
conf0.cur_ind = 1
conf0.pos_bw = 100
conf0.vel_bw = 500
conf0.vel_d = 5
vel_int0.mode = 1
vel1.bc = 1
# The gantry link (shared/comps/gantry.c): this drive and the other Y
# drive exchange position error and velocity; the pid sees the bridge's yaw
# with r_vel times the velocity gain: r_vel ~ m_yaw / m_side = 4.7 / 21.5 = 0.22. The link
# itself: portal line `glink` here; on hardware a drive-to-drive CAN link
# (docs/motion_control.md, Gantry-aware control).
load gantry
gantry0.rt_prio = 7
gantry0.cmd = reslimit0.pos_out
gantry0.pos_in = fb_switch0.pos_fb
gantry0.vel_in = vel1.vel
pid0.pos_fb = gantry0.pos_out
pid0.vel_fb = gantry0.vel_out
gantry0.en = fault0.en_pid
gantry0.r_vel = 0.3
