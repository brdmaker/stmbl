# Y1 / Y2: Baldor LMCF08F-HC0 (ironless, 60.96 mm electrical period) on
# a 1 um absolute scale. Catalog: 1152 N / 7.8 A peak, 148.8 N/A, 21 ohm
# and 27.2 mH phase to phase, coil 3.07 kg. One drive revolution = 60.96 mm
# (host/README.md, Linear motors): j = m (p/2pi)^2, force = torque 2pi/p.
# j is the whole moving mass on this motor (half of bridge, carriage and
# head: 21 kg), not the coil's: the coil is bolted to the load, and vel1's
# observer predicts the acceleration from torque / conf0.j (DEBUGNOTES).
# vel_int0.mode 1: velocity and acceleration from LinuxCNC's position
# stream (exact for its planner), the acceleration fed forward; vel1.bc 1:
# the velocity observer without its lag under acceleration (2 d a / w).
# With bc, vel_bw is the real bandwidth (before, the lag made the loop
# about twice as stiff, and unstable above w/2d = 556).
link pid
link pmsm
link enc_fb0
link misc
link sserial
conf0.polecount = 1
conf0.mot_fb_res = 60960
conf0.r = 10.5
conf0.l = 0.0136
conf0.psi = 0.962
conf0.j = 0.001977
conf0.j_sys = 0
conf0.f = 0.2426
conf0.d = 0.002824
conf0.max_ac_cur = 7.8
conf0.max_force = 11.18
conf0.max_vel = 309
conf0.cur_ind = 1
conf0.pos_bw = 100
conf0.vel_bw = 500
conf0.vel_d = 5
vel_int0.mode = 1
vel1.bc = 1
