# Conveyor: 100 W 230 V 4-pole induction motor, sensorless V/f
# (acvf), commanded by LinuxCNC over smart-serial. Units
# are belt mm: linrev0.scale = belt mm per motor revolution
# (here 10). pos_fb / vel_fb report the estimated belt travel.
# sserial in2 (in-02 in LinuxCNC) = belt blocked.
link acvf
load ramp
ramp0.rt_prio = 5.1
# nameplate: 230 V (188 V phase peak), 50 Hz, 1322 rpm, 0.72 Nm
conf0.polecount = 2
conf0.j = 0.00015
conf0.max_ac_cur = 1.2
conf0.max_vel = 160
conf0.max_acc = 300
conf0.max_dc_volt = 390
conf0.high_dc_volt = 380
iit0.cur_boost = 1.8
acvf0.u_n = 188
acvf0.vel_n = 157
acvf0.slip_n = 0.119
acvf0.torque_n = 0.72
acvf0.u_boost = 5
# from the autotune (link id_acim; see host/README.md)
conf0.r = 39.99
conf0.l = 0.15
acvf0.rr = 38.4
acvf0.lm = 1.19
acvf0.ll = 0.158
ramp0.max_acc = conf0.max_acc
ramp0.max_vel = conf0.max_vel
ramp0.en = fault0.en_out
acvf0.vel_cmd = ramp0.vel_cmd
fault0.fb_ready = 1
link sserial_acvf
ramp0.vel_ext_cmd = linrev0.cmd_d_out
linrev0.scale = 10
