# Siemens 1FK6-class servo, a 600 V DC-link winding (Mikron HSM 400U's axis
# motors: GUESSED until the nameplates are read: type 1FK6..., M0, n_N,
# I0, kE, R, L, J). 8 poles (4 pole pairs), 3000 rpm at 600 V; kE such that
# its back-EMF at 3000 rpm is ~330 V line-to-line rms: psi 0.214 per pole
# pair, Kt 1.29 Nm per A amplitude (1.8 Nm/A rms). On an stmbl drive's
# ~325 V bus (230 V mains rectified) the voltage runs out at ~2000 rpm.
# The EnDat encoder (EQN 1325-like, absolute) as a 2^18 encoder.
link pid
link pmsm
link enc_fb0
link misc
link sserial
conf0.polecount = 4
conf0.mot_fb_polecount = 1
conf0.mot_fb_res = 262144
conf0.r = 1.2
conf0.l = 0.009
conf0.psi = 0.214
conf0.max_ac_cur = 15
conf0.max_force = 19
conf0.max_vel = 314
conf0.cur_ind = 1
conf0.j_sys = 0
conf0.vel_d = 5
vel_int0.mode = 1
vel1.bc = 1
