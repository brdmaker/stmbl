# A glass scale (Heidenhain LS 4x6-like, 20 um grating, 1 Vpp interpolated
# to 0.1 um) on the axis, read by the drive's enc_fb1: the position loop on
# it, the velocity loop on the motor's EnDat. joint_fb_res: counts a motor
# turn, 16 mm / 0.1 um.
load enc_fb
enc_fb1.rt_prio = 2
enc_fb1.res = conf0.joint_fb_res
fb_switch0.joint_pos = enc_fb1.pos
fb_switch0.joint_abs_pos = enc_fb1.abs_pos
fb_switch0.joint_state = enc_fb1.state
fb_switch0.mot_joint_ratio = 1
idx_home0.fb = fb_switch0.joint_fb_no_offset
idx_home0.fb_abs = enc_fb1.abs_pos
conf0.joint_fb_res = 160000
