# A 10 um linear scale on the axis (enc_fb1) as the position feedback:
# the position loop closes on it, the velocity loop on the motor's
# resolver (fb_switch0 uses the joint feedback for pos_fb when its state is
# 1 or 3). LinuxCNC sees the scale too. joint_fb_res: counts per motor
# turn, pitch / 10 um (x, y: 10 mm -> 1000; z: scale10z.conf).
load enc_fb
enc_fb1.rt_prio = 2
enc_fb1.res = conf0.joint_fb_res
fb_switch0.joint_pos = enc_fb1.pos
fb_switch0.joint_abs_pos = enc_fb1.abs_pos
fb_switch0.joint_state = enc_fb1.state
fb_switch0.mot_joint_ratio = 1
idx_home0.fb = fb_switch0.joint_fb_no_offset
idx_home0.fb_abs = enc_fb1.abs_pos
conf0.joint_fb_res = 1000
