conf0.mot_fb_polecount = 1
conf0.mot_fb_res = 16384
conf0.r = 9.96
conf0.l = 0.02275
conf0.psi = 0.1455
conf0.max_ac_cur = 8.5
conf0.max_force = 3.8
conf0.max_vel = 314
conf0.cur_ind = 1
conf0.j_sys = 0
conf0.vel_d = 5
vel_int0.mode = 1
vel1.bc = 1
