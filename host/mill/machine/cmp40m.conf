# SEW CMP40M (3000 rpm, 400 V class) without its gearbox, on a ball screw
# (conf/sew_cmp40m.txt on the mill branch: line-to-line catalog values
# halved). The RH1M resolver is simulated as a 14-bit encoder (16384) with
# a count of jitter (rnoise in the machine file). Peak 6 A rms = 8.5 A
# amplitude, 3.8 Nm. j, f, o per axis (x.conf, y.conf, z.conf).
# vel_int0.mode 1 and vel1.bc 1: as host/portal (exact command stream,
# the observer without its lag).
