# hwtest/hsm400u-sim: LinuxCNC drives the simulated Mikron HSM 400U retrofit
# (host/mill, machine/hsm400u.mill): five simulated stmbl drives with the
# machine's Siemens servos (EnDat) on stmbl's ~325 V bus, X Y Z on ball
# screws (glass scales: hsm400u_scales / _blend), the A/C trunnion through
# xyzac-trt-kins (tool centre point: programs in the work's coordinates).
# The kinematics' pivots and tool match the machine file's trt line.
# Absolute encoders: HOME_ABSOLUTE_ENCODER (no motion). All machine data
# are guesses (host/mill/HSM400U.md).

[EMC]
VERSION = 1.1
MACHINE = hsm400u-sim (Mikron HSM 400U retrofit)
DEBUG = 0

[DISPLAY]
# axis for a GUI; the test runs with DISPLAY = ./mill_run.py
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 450
DEFAULT_LINEAR_VELOCITY = 50
MAX_ANGULAR_VELOCITY = 80
DEFAULT_ANGULAR_VELOCITY = 20
GEOMETRY = XYZAC

[RS274NGC]
PARAMETER_FILE = hsm.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hsm.hal

[HALUI]

[MILL]
# the machine file (host/mill/machine): hsm400u.mill on the motors' EnDat,
# hsm400u_scales.mill with the glass scales, hsm400u_blend.mill blended
FILE = ../../host/mill/machine/hsm400u.mill
LIB = ../../host/arm/libstmbl_drive.so

[TRAJ]
COORDINATES = X Y Z A C
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 450
DEFAULT_LINEAR_ACCELERATION = 4000
MAX_LINEAR_ACCELERATION = 4000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = xyzac-trt-kins
JOINTS = 5

[AXIS_X]
MIN_LIMIT = -400
MAX_LIMIT = 800
MAX_VELOCITY = 450
MAX_ACCELERATION = 4000

[AXIS_Y]
MIN_LIMIT = -400
MAX_LIMIT = 850
MAX_VELOCITY = 450
MAX_ACCELERATION = 4000

[AXIS_Z]
MIN_LIMIT = -600
MAX_LIMIT = 200
MAX_VELOCITY = 450
MAX_ACCELERATION = 4000

[AXIS_A]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 80
MAX_ACCELERATION = 600

[AXIS_C]
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 120
MAX_ACCELERATION = 900

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 401
MAX_VELOCITY = 470
MAX_ACCELERATION = 4400
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 451
MAX_VELOCITY = 470
MAX_ACCELERATION = 4400
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -361
MAX_LIMIT = 1
MAX_VELOCITY = 470
MAX_ACCELERATION = 4400
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_3]
TYPE = ANGULAR
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 85
MAX_ACCELERATION = 660
FERROR = 0.5
MIN_FERROR = 0.05
