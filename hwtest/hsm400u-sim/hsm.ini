HOME_ABSOLUTE_ENCODER = 2

[JOINT_4]
TYPE = ANGULAR
MIN_LIMIT = -99999
MAX_LIMIT = 99999
MAX_VELOCITY = 125
MAX_ACCELERATION = 1000
FERROR = 0.5
MIN_FERROR = 0.05
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2
