# hwtest/mill-sim/console.ini: the simulated CN 720 (mill.ini) with the
# browser console (webui/mill/millweb) as LinuxCNC's display instead of AXIS.
#   linuxcnc console.ini        then http://<host>:8080/
# Programs: ~/cn720/nc_files; G54 at the table's centre (console.var).
# hwtest/mill-sim: LinuxCNC drives the simulated Scripta CN 720
# (host/mill): a fixed bridge, the table moving in Y, ball screws and SEW
# CMP40M servos on simulated stmbl drives in LinuxCNC's servo thread
# (stmbl_mill module). trivkins XYZ, one joint per axis; machine Y is the
# tool relative to the table. Absolute positions: homing is
# HOME_ABSOLUTE_ENCODER (no motion). Limits: 30 m/min on X and Y (10 mm
# screws at 3000 rpm), 15 m/min on Z (5 mm), 5 m/s^2.
# SERVO_PERIOD 500000 for a 2 kHz servo thread (mill_test.py --servo 0.5):
# the drives' vel_int0.cmd_freq follows the thread's period.

[EMC]
VERSION = 1.1
MACHINE = mill-sim (Scripta CN 720), console
DEBUG = 0

[DISPLAY]
# axis for a GUI; the test runs with DISPLAY = ./mill_run.py
DISPLAY = ../../webui/mill/millweb
PROGRAM_PREFIX = ~/cn720/nc_files
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.5
MIN_SPINDLE_OVERRIDE = 0.5
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 500
DEFAULT_LINEAR_VELOCITY = 50
GEOMETRY = XYZ

[MILLWEB]
# the console on the simulated CN 720 (webui/mill/machines/cn720: a fixed
# bridge over a table moving in Y)
PORT = 8080
HOST = 0.0.0.0
MACHINE_TYPE = bridge
# X Y (machine) Z_above Z_ref [travel], as machines/cn720/machine.json
TOOLSETTER = 680 410 -40 -185 120
AT_SPEED_PIN = spindle.0.at-speed
# millweb off the real-time cores (isolcpus=2,3 on the bench Pi)
CPUS = 0-1
PIN = joint.0.f-error
PIN = joint.1.f-error
PIN = joint.2.f-error
PIN = stmbl-mill.0.0.current
PIN = stmbl-mill.0.1.current
PIN = stmbl-mill.0.2.current
DRIVE = X stmbl-mill.0.0.current stmbl-mill.0.0.power stmbl-mill.0.0.fault
DRIVE = Y stmbl-mill.0.1.current stmbl-mill.0.1.power stmbl-mill.0.1.fault
DRIVE = Z stmbl-mill.0.2.current stmbl-mill.0.2.power stmbl-mill.0.2.fault

[RS274NGC]
PARAMETER_FILE = console.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = mill.hal
HALFILE = console.hal

[HALUI]

[MILL]
# the machine file (host/mill/machine): cn720.mill on the resolvers,
# cn720_blend.mill with 10 um scales blended in (cn720_scales.mill: the
# position loops on the scales)
FILE = ../../host/mill/machine/cn720.mill
LIB = ../../host/arm/libstmbl_drive.so

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 500
DEFAULT_LINEAR_ACCELERATION = 5000
MAX_LINEAR_ACCELERATION = 5000
ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES = 4
ARC_BLEND_RAMP_FREQ = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = console.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 700
MAX_VELOCITY = 500
MAX_ACCELERATION = 5000

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 430
MAX_VELOCITY = 500
MAX_ACCELERATION = 5000

[AXIS_Z]
MIN_LIMIT = -200
MAX_LIMIT = 0
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 701
MAX_VELOCITY = 520
MAX_ACCELERATION = 5500
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 431
MAX_VELOCITY = 520
MAX_ACCELERATION = 5500
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -201
MAX_LIMIT = 1
MAX_VELOCITY = 260
MAX_ACCELERATION = 5500
FERROR = 1
MIN_FERROR = 0.2
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2
