# hwtest/portal-sim: LinuxCNC drives the simulated portal (host/portal):
# a gantry, X on the bridge and Y on two linear motors (Y1, Y2), each on a
# simulated stmbl drive in LinuxCNC's servo thread (stmbl_portal module).
# trivkins XYY: joint 0 = X, joints 1 and 2 = Y. Absolute linear scales:
# homing is HOME_ABSOLUTE_ENCODER (no motion). The speed and acceleration
# limits are what bench.py sweeps (it rewrites the @V@ / @A@ values).

[EMC]
VERSION = 1.1
MACHINE = portal-sim
DEBUG = 0

[DISPLAY]
# axis for a GUI; the benchmark runs with DISPLAY = ./portal_run.py
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 1600
DEFAULT_LINEAR_VELOCITY = 100
GEOMETRY = XY

[RS274NGC]
PARAMETER_FILE = portal.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = portal.hal

[HALUI]

[PORTAL]
FILE = ../../host/portal/machine/portal.portal
LIB = ../../host/arm/libstmbl_drive.so

[PCOMP]
# linuxcnc/pcomp, used with HALFILE = portal_pcomp.hal (bench.py --pcomp):
# the model (here the simulated machine's own head modes; on a real machine
# from the step test, hwtest/portal-sim/README.md) and the parts switched on
SHAPER = 1
DEFL = 1
SHRINK = 1
SERVO = 0
JERK_MS = 20
FX = 45
FY_END = 55
FY_MID = 28
ZETA = 0.03
RAILS = 1.2
X_CENTER = 500
SERVO_TAU2 = 0

[TRAJ]
COORDINATES = X Y Y
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 1600
DEFAULT_LINEAR_ACCELERATION = 5000
MAX_LINEAR_ACCELERATION = 5000
ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES = 4
ARC_BLEND_RAMP_FREQ = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYY kinstype=BOTH
JOINTS = 3

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 1000
MAX_VELOCITY = 1600
MAX_ACCELERATION = 5000

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 1000
MAX_VELOCITY = 1600
MAX_ACCELERATION = 5000

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 1700
MAX_ACCELERATION = 5500
FERROR = 2
MIN_FERROR = 0.5
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 1700
MAX_ACCELERATION = 5500
FERROR = 2
MIN_FERROR = 0.5
HOME = 0
HOME_SEQUENCE = -1
HOME_ABSOLUTE_ENCODER = 2

[JOINT_2]
TYPE = LINEAR
MIN_LIMIT = -1
MAX_LIMIT = 1001
MAX_VELOCITY = 1700
MAX_ACCELERATION = 5500
FERROR = 2
MIN_FERROR = 0.5
HOME = 0
HOME_SEQUENCE = -1
HOME_ABSOLUTE_ENCODER = 2
