# hwtest/arcmate-sim: the ARC Mate (A05B-1203-B255) simulated, with
# LinuxCNC as the master: genserkins, six joints, each on a simulated stmbl
# drive (host/arm, stmbl_arm module). All arm values are GUESSES
# (host/arm/arcmate/arcmate.arm) until hwtest/arcmate/RECORD.md is filled.
# Joint angles are genserkins' DH theta (the model angle + theta0).

[EMC]
VERSION = 1.1
MACHINE = arcmate-sim
DEBUG = 0

[DISPLAY]
# axis for a GUI; the tests run with DISPLAY = ./lcnc_test.py
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_LINEAR_VELOCITY = 250
DEFAULT_LINEAR_VELOCITY = 50
MAX_ANGULAR_VELOCITY = 90
DEFAULT_ANGULAR_VELOCITY = 20
GEOMETRY = XYZABC

[RS274NGC]
PARAMETER_FILE = arcmate.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = arcmate.hal

[HALUI]

[STMBL_ARM]
ARM = ../../host/arm/arcmate/arcmate.arm
LIB = ../../host/arm/libstmbl_drive.so

[TRAJ]
COORDINATES = X Y Z A B C
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 250
DEFAULT_LINEAR_ACCELERATION = 500
MAX_LINEAR_ACCELERATION = 1000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = genserkins
JOINTS = 6

[AXIS_X]
MIN_LIMIT = -2000
MAX_LIMIT = 2000
MAX_VELOCITY = 250
MAX_ACCELERATION = 1000

[AXIS_Y]
MIN_LIMIT = -2000
MAX_LIMIT = 2000
MAX_VELOCITY = 250
MAX_ACCELERATION = 1000

[AXIS_Z]
MIN_LIMIT = -2000
MAX_LIMIT = 2000
MAX_VELOCITY = 250
MAX_ACCELERATION = 1000

[AXIS_A]
MIN_LIMIT = -720
MAX_LIMIT = 720
MAX_VELOCITY = 90
MAX_ACCELERATION = 360

[AXIS_B]
MIN_LIMIT = -720
MAX_LIMIT = 720
MAX_VELOCITY = 90
MAX_ACCELERATION = 360

[AXIS_C]
MIN_LIMIT = -720
MAX_LIMIT = 720
MAX_VELOCITY = 90
MAX_ACCELERATION = 360

[JOINT_0]
TYPE = ANGULAR
MIN_LIMIT = -170
MAX_LIMIT = 170
MAX_VELOCITY = 100
MAX_ACCELERATION = 300
FERROR = 2
MIN_FERROR = 1
HOME = 0
HOME_SEQUENCE = 0
HOME_ABSOLUTE_ENCODER = 2

